apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-processor
  namespace: kafka-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-processor
  template:
    metadata:
      labels:
        app: order-processor
    spec:
      containers:
        - name: order-processor
          image: order-processor:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: order-processor-config
            - secretRef:
                name: app-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: order-processor
  namespace: kafka-app
spec:
  selector:
    app: order-processor
  ports:
    - name: http
      port: 8080
      targetPort: 8080
